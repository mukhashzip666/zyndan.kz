services:
  # Основное PHP веб-приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: informnews_app
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-qyzylorda_times}
      DB_USER: ${DB_USER:-qyzylorda_user}
      DB_PASS: ${DB_PASS:-qyzylorda_pass_2026}
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - ./public/uploads:/var/www/html/public/uploads
      - ./config:/var/www/html/config
      - ./logs:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy

  # База данных MySQL 8.0 с автоимпортом дампа
  db:
    image: mysql:8.0
    container_name: informnews_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-qyzylorda_times}
      MYSQL_USER: ${DB_USER:-qyzylorda_user}
      MYSQL_PASSWORD: ${DB_PASS:-qyzylorda_pass_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-qyzylorda_root_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_backup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-qyzylorda_root_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # phpMyAdmin для удобного просмотра и управления БД (порт 8080)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: informnews_pma
    restart: always
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    depends_on:
      - db

volumes:
  mysql_data:

